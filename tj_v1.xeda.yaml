hdl.vhdl.standard: 2008

sources:
  - LWC/LWC_config_32.vhd
  - LWC/NIST_LWAPI_pkg.vhd
  - src_rtl/v1/design_pkg.vhd
  - src_rtl/v1/nlfsr.vhd
  - src_rtl/v1/tinyjambu_control.vhd
  - src_rtl/v1/tinyjambu_datapath.vhd
  - src_rtl/v1/CryptoCore.vhd
  - LWC/PISO.vhd
  - LWC/SIPO.vhd
  - LWC/FIFO.vhd
  - LWC/PreProcessor.vhd
  - LWC/PostProcessor.vhd
  - LWC/LWC.vhd

top: LWC
clock.port: clk

test:
  sources:
    - LWC/LWC_config_32.vhd
    - LWC/NIST_LWAPI_pkg.vhd
    - src_tb/LWC_TB.vhd
  top: LWC_TB
  parameters:
    G_FNAME_PDI:
      file: KAT/pdi.txt
    G_FNAME_SDI:
      file: KAT/sdi.txt
    G_FNAME_DO:
      file: KAT/do.txt


flows:
  dc:
    outputs_dir: $PWD/v1_netlist
    target_libraries:
      - lib/SAED90/saed90nm_typ_ht.db
    clock.freq: 20MHz
    optimization: none
    # compile_command: compile_ultra
    compile_command: compile
    # sdc_files:
    #   - v1_constraints.sdc